# Single-stack example running actual-truelayer-manager together with a
# self-hosted Actual Budget server. Pulls the published GHCR image — no local
# build required.
#
#   docker compose -f compose.actual-budget.yml up -d
#   # Actual Budget UI:            http://localhost:5006
#   # actual-truelayer-manager UI: http://localhost:3020/setup
#
# First open the Actual Budget UI, create/import a budget, and note its Sync ID
# and password. Then complete the manager's setup wizard. Without live
# TRUELAYER_* + ACTUAL_* credentials the manager runs in demo mode.
# Do not commit real secrets — prefer *_FILE mounts or runtime injection.

services:
  actual-server:
    image: actualbudget/actual-server:latest
    container_name: actual-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:5006:5006"
    volumes:
      - actual-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:5006/',r=>process.exit(0)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5

  actual-truelayer-manager:
    image: ghcr.io/avbuse/actual-truelayer-manager:latest
    container_name: actual-truelayer-manager
    restart: unless-stopped
    depends_on:
      actual-server:
        condition: service_healthy
    ports:
      # Host port bound to localhost only; container binds 0.0.0.0 internally.
      - "127.0.0.1:3020:3020"
    environment:
      APP_BIND_HOST: "0.0.0.0"
      APP_PORT: "3020"
      APP_BASE_URL: "http://localhost:3020"
      APP_DATA_DIR: "/app/data"
      # Points at the Actual server on the shared compose network.
      ACTUAL_SERVER_URL: "http://actual-server:5006"
      SYNC_INTERVAL_HOURS: "6"
      SYNC_OVERLAP_DAYS: "3"
      LOG_LEVEL: "info"
      # Prefer *_FILE or runtime secret injection for live values:
      # ACTUAL_PASSWORD_FILE: "/run/secrets/actual_password"
      # ACTUAL_ENCRYPTION_PASSWORD_FILE: "/run/secrets/actual_encryption_password"
      # TRUELAYER_CLIENT_SECRET_FILE: "/run/secrets/truelayer_client_secret"
      # APP_ENCRYPTION_KEY_FILE: "/run/secrets/app_encryption_key"
      # Non-secret live identifiers may be set directly when ready:
      # ACTUAL_SYNC_ID: "your-budget-sync-id"
      # TRUELAYER_CLIENT_ID: "your-truelayer-client-id"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3020/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  actual-data:
